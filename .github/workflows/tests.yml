name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    name: 离线自检（不联网、不需要 API Key）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q pdf_translator tools tests run_cli.py run_gui.py

      - name: 端到端离线自检
        run: python tests/test_offline.py

      - name: 图形界面冒烟测试（无显示环境会自动跳过）
        run: python tests/test_gui_smoke.py
